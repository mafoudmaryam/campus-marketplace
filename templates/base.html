{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Campus Marketplace{% endblock %}</title>
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'listings:home' %}">🎓 Campus Marketplace</a>
      <form class="d-flex flex-grow-1 mx-lg-4 my-2 my-lg-0" method="get" action="{% url 'listings:home' %}">
        <input class="form-control me-2" type="search" name="q" placeholder="Search items" value="{{ request.GET.q }}">
        <button class="btn btn-outline-light" type="submit">Search</button>
      </form>
      <div class="d-flex gap-2 align-items-center">
        <a class="btn btn-warning" href="#">Sell an item</a>
        {% if user.is_authenticated %}
          <span class="navbar-text text-light">Hi, {{ user.username }}</span>
          <form method="post" action="{% url 'accounts:logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light">Log out</button>
          </form>
        {% else %}
          <a class="btn btn-outline-light" href="{% url 'accounts:login' %}">Log in</a>
          <a class="btn btn-outline-light" href="{% url 'accounts:signup' %}">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
