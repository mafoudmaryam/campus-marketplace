{% extends "base.html" %}

{% block title %}Sign up - Campus Marketplace{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Create your account</h1>
        <form class="form-plain" method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary w-100">Sign up</button>
        </form>
        <p class="mt-3 mb-0 text-muted">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
