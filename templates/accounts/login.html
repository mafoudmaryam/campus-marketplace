{% extends "base.html" %}

{% block title %}Log in - Campus Marketplace{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Log in</h1>
        <form class="form-plain" method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
        <p class="mt-3 mb-0 text-muted">New here? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
